services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  scheduler-engine:
    build:
      context: ./services/scheduler-engine
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      PORT: 8000
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SCHEDULER_ENGINE_URL: http://scheduler-engine:8000
      SCHEDULER_ENGINE_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      scheduler-engine:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Puste = requesty przez nginx (/api, /socket.io)
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  redis_data:

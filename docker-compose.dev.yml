# Dev overlay: hot reload + porty jak lokalnie (pnpm dev)
# Użycie: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  scheduler-engine:
    build:
      target: dev
    volumes:
      - ./services/scheduler-engine/src:/app/src
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    ports:
      - '8000:8000'

  backend:
    build:
      target: dev
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/package.json:/app/apps/backend/package.json
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/package.json:/app/packages/shared/package.json
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      SCHEDULER_ENGINE_URL: http://scheduler-engine:8000
      SCHEDULE_MOCK_WORKER_DRAFTS: ${SCHEDULE_MOCK_WORKER_DRAFTS:-false}
      SCHEDULE_GENERATE_MOCK: ${SCHEDULE_GENERATE_MOCK:-false}
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      scheduler-engine:
        condition: service_started
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @scheduler/shared dev & pnpm --filter @scheduler/backend dev"

  frontend:
    build:
      target: dev
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./packages/shared/src:/app/packages/shared/src
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_SOCKET_URL: http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_started
    command: pnpm --filter @scheduler/frontend dev -- --host 0.0.0.0

  redis:
    ports:
      - '6379:6379'
